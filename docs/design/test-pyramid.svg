<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="unitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="integGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="e2eGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #6b7280; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: white; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: rgba(255,255,255,0.85); }
      .percent { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1a1a2e; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fc" rx="16"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" class="title">ScreenPal 测试金字塔</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle">分层测试策略 · 覆盖率目标 · 工具链</text>

  <!-- E2E Tests (Top) - 10% -->
  <polygon points="400,120 240,220 560,220" fill="url(#e2eGrad)" filter="url(#shadow)"/>
  <text x="400" y="175" text-anchor="middle" class="label">E2E 测试</text>
  <text x="400" y="195" text-anchor="middle" class="sublabel">端到端流程验证</text>
  <text x="620" y="185" class="percent">10%</text>

  <!-- Integration Tests (Middle) - 30% -->
  <polygon points="400,230 140,380 660,380" fill="url(#integGrad)" filter="url(#shadow)"/>
  <text x="400" y="310" text-anchor="middle" class="label">集成测试</text>
  <text x="400" y="330" text-anchor="middle" class="sublabel">模块交互 / 接口验证</text>
  <text x="690" y="320" class="percent">30%</text>

  <!-- Unit Tests (Bottom) - 60% -->
  <polygon points="400,390 40,540 760,540" fill="url(#unitGrad)" filter="url(#shadow)"/>
  <text x="400" y="470" text-anchor="middle" class="label">单元测试</text>
  <text x="400" y="490" text-anchor="middle" class="sublabel">函数 / 工具类 / 业务逻辑</text>
  <text x="780" y="480" class="percent">60%</text>

  <!-- Details for each layer -->
  <!-- E2E Details -->
  <rect x="100" y="560" width="220" height="28" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="210" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #92400e; font-weight: 600;">5 个端到端流程</text>

  <rect x="340" y="560" width="120" height="28" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="400" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #92400e; font-weight: 600;">模拟器/真机</text>

  <rect x="480" y="560" width="100" height="28" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="530" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #92400e; font-weight: 600;">Compose Test</text>

  <!-- Integration Details -->
  <rect x="60" y="560" width="200" height="28" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="160" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #1e40af; font-weight: 600;">悬浮窗 + 框选集成</text>

  <rect x="280" y="560" width="160" height="28" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="360" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #1e40af; font-weight: 600;">OCR + TTS 集成</text>

  <rect x="460" y="560" width="140" height="28" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="530" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #1e40af; font-weight: 600;">权限流程集成</text>

  <!-- Unit Details -->
  <rect x="60" y="560" width="180" height="28" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="150" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #065f46; font-weight: 600;">PermissionHelper</text>

  <rect x="255" y="560" width="140" height="28" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="325" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #065f46; font-weight: 600;">ImageCropper</text>

  <rect x="410" y="560" width="160" height="28" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="490" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #065f46; font-weight: 600;">OcrEngine 策略</text>

  <rect x="585" y="560" width="140" height="28" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="655" y="579" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #065f46; font-weight: 600;">TtsManager</text>

  <!-- Legend -->
  <rect x="60" y="90" width="16" height="16" rx="4" fill="url(#unitGrad)"/>
  <text x="84" y="103" style="font-family: -apple-system, sans-serif; font-size: 13px; fill: #4b5563;">单元测试 (Unit Tests)</text>

  <rect x="220" y="90" width="16" height="16" rx="4" fill="url(#integGrad)"/>
  <text x="244" y="103" style="font-family: -apple-system, sans-serif; font-size: 13px; fill: #4b5563;">集成测试 (Integration Tests)</text>

  <rect x="420" y="90" width="16" height="16" rx="4" fill="url(#e2eGrad)"/>
  <text x="444" y="103" style="font-family: -apple-system, sans-serif; font-size: 13px; fill: #4b5563;">E2E 测试 (End-to-End Tests)</text>
</svg>
