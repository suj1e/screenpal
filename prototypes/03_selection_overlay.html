<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ScreenPal - 框选界面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  .container {
    position: relative;
    width: 100%; height: 100vh;
    overflow: hidden;
  }

  /* Screenshot background */
  .screenshot {
    position: absolute; inset: 0;
    background: linear-gradient(175deg, #1e1b4b 0%, #1e3a5f 30%, #0f172a 70%, #1a1a2e 100%);
    display: flex; flex-direction: column;
    padding: 52px 20px 20px;
  }
  .screenshot-header {
    display: flex; align-items: center; justify-content: space-between;
    color: white; margin-bottom: 20px;
  }
  .screenshot-time { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .screenshot-icons { display: flex; gap: 8px; font-size: 13px; opacity: 0.9; }
  .screenshot-content { flex: 1; }
  .mock-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px; padding: 18px;
    margin-bottom: 14px; color: white;
    backdrop-filter: blur(10px);
  }
  .mock-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.2px; }
  .mock-text { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.65); }
  .mock-highlight {
    background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(245,158,11,0.15));
    border-left: 3px solid #fbbf24;
    padding: 10px 14px; border-radius: 0 12px 12px 0;
    margin: 10px 0; font-size: 13px; color: #fbbf24; font-weight: 500;
  }
  .mock-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 84px;
    background: rgba(15, 15, 30, 0.7);
    backdrop-filter: blur(24px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: 12px;
  }
  .mock-nav-item { text-align: center; color: rgba(255,255,255,0.45); font-size: 10px; font-weight: 500; }
  .mock-nav-item.active { color: #a78bfa; }
  .mock-nav-icon { font-size: 22px; display: block; margin-bottom: 3px; }

  /* Overlay canvas */
  .overlay { position: absolute; inset: 0; z-index: 10; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  /* Top bar - premium glass style */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 20;
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,10,30,0.75) 0%, rgba(10,10,30,0.2) 60%, transparent 100%);
    backdrop-filter: blur(12px);
    color: white;
  }
  .top-bar-btn {
    width: 38px; height: 38px; border-radius: 19px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; color: white;
    transition: all 0.2s;
  }
  .top-bar-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.94); }
  .top-bar-btn:disabled { opacity: 0.35; }
  .top-bar-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }

  /* Bottom action bar */
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 16px 16px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(10,10,30,0.85) 0%, rgba(10,10,30,0.4) 70%, transparent 100%);
    backdrop-filter: blur(16px);
    display: flex; gap: 10px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .bottom-bar.show { transform: translateY(0); }

  .action-btn {
    flex: 1; padding: 15px; border-radius: 16px; border: none;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }
  .action-btn:active { transform: scale(0.96); }
  .btn-cancel {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    backdrop-filter: blur(12px);
  }
  .btn-confirm {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    box-shadow: 0 4px 16px rgba(99,102,241,0.4);
  }

  /* Loading overlay */
  .loading-overlay {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(10,10,30,0.6);
    backdrop-filter: blur(12px);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: white;
  }
  .loading-overlay.show { display: flex; }

  /* Premium spinner */
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3.5px solid rgba(255,255,255,0.12);
    border-top-color: #a78bfa;
    animation: spin 0.7s linear infinite;
    box-shadow: 0 0 24px rgba(99,102,241,0.3);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .loading-sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: -10px; }

  /* Selection info pill */
  .selection-info {
    position: absolute; z-index: 15;
    background: rgba(99,102,241,0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    color: white; padding: 5px 12px; border-radius: 10px;
    font-size: 12px; font-weight: 700;
    pointer-events: none; display: none;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }

  /* Initial hint */
  .hint-pulse {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 12;
    color: rgba(255,255,255,0.85);
    font-size: 15px; font-weight: 600;
    text-align: center;
    pointer-events: none;
    animation: hintFade 2.5s ease-out forwards;
  }
  .hint-pulse::before {
    content: '👆';
    display: block;
    font-size: 32px;
    margin-bottom: 8px;
    animation: hintBounce 1s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes hintBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <div class="container" id="container">
    <div class="screenshot">
      <div class="screenshot-header">
        <div class="screenshot-time">9:41</div>
        <div class="screenshot-icons">📶 🔋</div>
      </div>
      <div class="screenshot-content">
        <div class="mock-card">
          <div class="mock-title">📰 今日热点新闻</div>
          <div class="mock-text">
            以下是今天的精选内容，拖动选择你想识别的区域。
            <div class="mock-highlight">AI 技术在 2025 年迎来爆发式增长</div>
            多个大模型相继发布，端侧 AI 能力大幅提升。
          </div>
        </div>
        <div class="mock-card">
          <div class="mock-title">💬 热门讨论</div>
          <div class="mock-text">用户 ScreenPal 评价：悬浮窗功能太方便了！</div>
        </div>
      </div>
      <div class="mock-nav">
        <div class="mock-nav-item"><span class="mock-nav-icon">🏠</span>首页</div>
        <div class="mock-nav-item active"><span class="mock-nav-icon">📱</span>发现</div>
        <div class="mock-nav-item"><span class="mock-nav-icon">💬</span>消息</div>
        <div class="mock-nav-item"><span class="mock-nav-icon">👤</span>我的</div>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="selection-info" id="selectionInfo"></div>
    <div class="hint-pulse" id="hintPulse">拖拽选择识别区域</div>

    <div class="top-bar">
      <button class="top-bar-btn" id="cancelBtn">✕</button>
      <div class="top-bar-title">框选识别区域</div>
      <button class="top-bar-btn" id="confirmBtn" disabled>✓</button>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <button class="action-btn btn-cancel" id="reselectBtn">🔄 重新选择</button>
      <button class="action-btn btn-confirm" id="recognizeBtn">🔍 识别文字</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">正在识别文字...</div>
      <div class="loading-sub">ML Kit 端侧识别 + 云端增强</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('container');
  const selectionInfo = document.getElementById('selectionInfo');
  const bottomBar = document.getElementById('bottomBar');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const confirmBtn = document.getElementById('confirmBtn');
  const hintPulse = document.getElementById('hintPulse');

  let isDrawing = false, hasSelection = false;
  let startX, startY, currX, currY;
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = container.offsetWidth * dpr;
    canvas.height = container.offsetHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (hasSelection) drawSelection(startX, startY, currX, currY);
  }
  window.addEventListener('resize', resize);
  resize();

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function drawSelection(x1, y1, x2, y2) {
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    // Dim overlay with slight purple tint
    ctx.fillStyle = 'rgba(15, 10, 40, 0.55)';
    ctx.fillRect(0, 0, w, h);

    // Clear selection area
    const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
    const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
    ctx.clearRect(rx, ry, rw, rh);

    // Premium border with glow
    ctx.shadowColor = 'rgba(99, 102, 241, 0.6)';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.strokeRect(rx + 1, ry + 1, rw - 2, rh - 2);
    ctx.shadowBlur = 0;

    // Corner handles
    const hs = 7;
    ctx.fillStyle = '#6366f1';
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    [[rx, ry], [rx + rw, ry], [rx, ry + rh], [rx + rw, ry + rh]].forEach(([hx, hy]) => {
      ctx.beginPath();
      ctx.arc(hx, hy, hs / 2 + 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    // Dimension badge
    if (rw > 50 && rh > 36) {
      const label = `${Math.round(rw)} × ${Math.round(rh)}`;
      ctx.font = 'bold 11px -apple-system, sans-serif';
      const tw = ctx.measureText(label).width;
      const lx = rx + rw / 2 - tw / 2 - 10;
      const ly = ry - 22;
      ctx.fillStyle = 'rgba(99,102,241,0.92)';
      ctx.beginPath();
      ctx.roundRect(lx, ly, tw + 20, 22, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.fillText(label, lx + 10, ly + 15);
    }
  }

  function onStart(e) {
    e.preventDefault();
    if (hintPulse.style.display !== 'none') hintPulse.style.display = 'none';
    const pos = getPos(e);
    isDrawing = true;
    startX = pos.x; startY = pos.y;
    currX = pos.x; currY = pos.y;
    bottomBar.classList.remove('show');
    confirmBtn.disabled = true;
    selectionInfo.style.display = 'none';
  }

  function onMove(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    currX = pos.x; currY = pos.y;
    drawSelection(startX, startY, currX, currY);

    const rx = Math.min(startX, currX), ry = Math.min(startY, currY);
    const rw = Math.abs(currX - startX), rh = Math.abs(currY - startY);
    if (rw > 10 && rh > 10) {
      selectionInfo.style.display = 'block';
      selectionInfo.style.left = rx + 'px';
      selectionInfo.style.top = (ry - 36) + 'px';
      selectionInfo.textContent = `${Math.round(rw)} × ${Math.round(rh)}`;
    }
  }

  function onEnd(e) {
    if (!isDrawing) return;
    isDrawing = false;
    const rw = Math.abs(currX - startX), rh = Math.abs(currY - startY);
    if (rw > 24 && rh > 24) {
      hasSelection = true;
      bottomBar.classList.add('show');
      confirmBtn.disabled = false;
      selectionInfo.style.display = 'none';
    } else {
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
      hasSelection = false;
    }
  }

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchend', onEnd);

  document.getElementById('cancelBtn').addEventListener('click', () => {
    hasSelection = false;
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    bottomBar.classList.remove('show');
    confirmBtn.disabled = true;
  });

  document.getElementById('reselectBtn').addEventListener('click', () => {
    hasSelection = false;
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    bottomBar.classList.remove('show');
    confirmBtn.disabled = true;
  });

  document.getElementById('recognizeBtn').addEventListener('click', () => {
    if (!hasSelection) return;
    loadingOverlay.classList.add('show');
    setTimeout(() => {
      loadingOverlay.classList.remove('show');
      alert('✅ 识别完成！\n\n识别结果：\n"AI 技术在 2025 年迎来爆发式增长"\n\n即将语音播报...');
    }, 2200);
  });
</script>
</body>
</html>
