<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="PingFang SC, sans-serif"><rect width="960" height="420" fill="#F6F5FA"/><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">权限卡片：三能力如实呈现</text><text x="36" y="70" font-size="13" fill="#6b7280">悬浮窗 / 通知 / 无障碍（免弹窗截屏）——录制弹窗的困惑从根上消除</text><rect x="60" y="120" width="420" height="64" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="270" y="144" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">悬浮窗权限</text><text x="270" y="168" text-anchor="middle" font-size="12" fill="#6b7280">已授权 / 去授权（现状不变）</text><rect x="60" y="200" width="420" height="64" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="270" y="224" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">通知权限</text><text x="270" y="248" text-anchor="middle" font-size="12" fill="#6b7280">已授权 / 去授权（现状不变）</text><rect x="60" y="280" width="420" height="96" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="270" y="320" text-anchor="middle" font-weight="700" font-size="14" fill="#1E40AF">无障碍权限（免弹窗截屏）</text><text x="270" y="344" text-anchor="middle" font-size="12" fill="#1E40AF">已开启 ✓ ／ 去开启 → 系统无障碍设置</text><text x="80" y="404" font-size="12" fill="#6b7280">行说明：开启后点悬浮球零弹窗识读（Android 10 及以下回退系统录制弹窗）</text><rect x="540" y="120" width="380" height="150" rx="12" fill="#F59E0B" stroke="#92400E" stroke-width="2"/><text x="730" y="187" text-anchor="middle" font-weight="700" font-size="14" fill="#92400E">为什么之前会弹 Start recording？</text><text x="730" y="211" text-anchor="middle" font-size="12" fill="#6b7280">#FFF7ED</text><text x="560" y="156" font-size="12" fill="#92400E">那是第三个独立授权（MediaProjection），</text><text x="560" y="180" font-size="12" fill="#92400E">与卡片上的两个权限无关；授权只存内存，</text><text x="560" y="204" font-size="12" fill="#92400E">进程重启后系统要求重新确认。</text><text x="560" y="240" font-size="12" font-weight="700" fill="#166534">无障碍路径启用后此弹窗彻底消失。</text></svg>