<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="40" y="90" width="240" height="240" rx="56"/>
    </clipPath>
    <clipPath id="circleClip">
      <circle cx="380" cy="210" r="120"/>
    </clipPath>
  </defs>

  <rect width="960" height="420" fill="#F6F5FA"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1a1a2e">ScreenPal 自适应图标 · 悬浮球同款</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">背景层：紫渐变 + 左上高光 ｜ 前景层：白色声波纹（66dp 安全区）｜ 同 prototypes/02_floating_window.html</text>

  <!-- squircle preview -->
  <g clip-path="url(#squircle)">
    <rect x="40" y="90" width="240" height="240" fill="url(#ballGrad)"/>
    <rect x="40" y="90" width="240" height="240" fill="url(#shine)"/>
    <g fill="#FFFFFF" fill-opacity="0.9">
      <rect x="104.4" y="193.3" width="16.7" height="33.3" rx="8.3"/>
      <rect x="143.3" y="171.1" width="16.7" height="77.8" rx="8.3"/>
      <rect x="171.1" y="182.2" width="16.7" height="55.6" rx="8.3"/>
      <rect x="204.4" y="160" width="16.7" height="100" rx="8.3"/>
    </g>
  </g>
  <text x="160" y="362" font-size="13" fill="#374151" text-anchor="middle">方形 mask（Pixel 等）</text>

  <!-- circle preview -->
  <g clip-path="url(#circleClip)">
    <circle cx="380" cy="210" r="120" fill="url(#ballGrad)"/>
    <circle cx="380" cy="210" r="120" fill="url(#shine)"/>
    <g fill="#FFFFFF" fill-opacity="0.9">
      <rect x="324.4" y="193.3" width="16.7" height="33.3" rx="8.3"/>
      <rect x="363.3" y="171.1" width="16.7" height="77.8" rx="8.3"/>
      <rect x="391.1" y="182.2" width="16.7" height="55.6" rx="8.3"/>
      <rect x="424.4" y="160" width="16.7" height="100" rx="8.3"/>
    </g>
  </g>
  <text x="380" y="362" font-size="13" fill="#374151" text-anchor="middle">圆形 mask（Circle 等）</text>

  <!-- safe zone diagram (108dp viewport) -->
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="240" height="240" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="46.7" y="46.7" width="146.7" height="146.7" fill="none" stroke="#A855F7" stroke-dasharray="6 4" stroke-width="2"/>
    <text x="120" y="38" font-size="12" fill="#7C3AED" text-anchor="middle">前景安全区 66dp（21–87）</text>
    <text x="8" y="16" font-size="11" fill="#9CA3AF">108×108dp viewport</text>
    <!-- waveform bars mapped into safe zone (108dp scale: 240px/108dp ≈ 2.22) -->
    <g fill="#7C3AED" fill-opacity="0.85">
      <rect x="64.4" y="103.3" width="16.7" height="33.3" rx="8.3"/>
      <rect x="103.3" y="81.1" width="16.7" height="77.8" rx="8.3"/>
      <rect x="131.1" y="92.2" width="16.7" height="55.6" rx="8.3"/>
      <rect x="164.4" y="70" width="16.7" height="100" rx="8.3"/>
    </g>
  </g>
  <text x="680" y="362" font-size="13" fill="#374151" text-anchor="middle">前景几何：四根圆角波条 ×2.5 平移居中（包络 29–78dp）</text>

  <!-- palette -->
  <g transform="translate(560,382)" font-size="12" fill="#374151">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#6366F1"/>
    <text x="24" y="14">#6366F1</text>
    <rect x="100" y="0" width="18" height="18" rx="4" fill="#7C3AED"/>
    <text x="124" y="14">#7C3AED</text>
    <rect x="200" y="0" width="18" height="18" rx="4" fill="#A855F7"/>
    <text x="224" y="14">#A855F7</text>
    <rect x="300" y="0" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="324" y="14">#E6FFFFFF 波纹</text>
  </g>
</svg>
