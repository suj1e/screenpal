<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'PingFang SC', sans-serif"><rect width="960" height="420" fill="#F6F5FA"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker></defs><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">随手画套索交互</text><text x="36" y="70" font-size="13" fill="#6b7280">画哪圈哪：自由笔迹 → 包围盒裁剪 → 识别播报（矩形拖拽成为历史）</text><rect x="60" y="100" width="380" height="280" rx="16" fill="#1F2937"/><rect x="90" y="130" width="150" height="40" rx="6" fill="#374151"/><text x="165" y="156" text-anchor="middle" font-size="12" fill="#9CA3AF">文字块 A</text><rect x="270" y="220" width="140" height="40" rx="6" fill="#374151"/><text x="340" y="246" text-anchor="middle" font-size="12" fill="#9CA3AF">文字块 B</text><path d="M 100 200 C 160 170 260 170 300 200 C 340 230 300 280 220 275 C 150 271 110 240 100 200" stroke="#FF7B68EE" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M 100 200 C 160 170 260 170 300 200 C 340 230 300 280 220 275 C 150 271 110 240 100 200 Z" stroke="#FF7B68EE" stroke-width="1" fill="none" stroke-dasharray="5 5" opacity="0.5"/><rect x="95" y="168" width="250" height="112" stroke="#A78BFA" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.6"/><text x="480" y="150" font-size="14" font-weight="700" fill="#1a1a2e">1. 手指随手画圈（8dp 采样）</text><text x="480" y="180" font-size="12" fill="#6b7280">2. 笔迹描边挖孔，圈内透亮</text><text x="480" y="210" font-size="12" fill="#6b7280">3. 抬手 → 包围盒 ≥48dp 即确认</text><text x="480" y="240" font-size="12" fill="#6b7280">4. 包围盒映射截图坐标 → 裁剪 → OCR</text><text x="480" y="270" font-size="12" fill="#6b7280">5. 单点/过小 → 震动提示并清空</text><text x="480" y="300" font-size="12" fill="#6b7280">6. 「重新框选」清空笔迹重来</text><rect x="480" y="330" width="420" height="60" rx="12" fill="#16A34A" stroke="#166534" stroke-width="2"/><text x="690" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#166534">上层零改动：onSelectionConfirmed(Rect) 签名不变</text><text x="690" y="376" text-anchor="middle" font-size="12" fill="#6b7280">#F0FDF4</text></svg>