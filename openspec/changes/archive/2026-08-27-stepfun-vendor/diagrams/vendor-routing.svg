<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, 'PingFang SC', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker></defs><rect width="960" height="440" fill="#F6F5FA"/><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">并列可选服务商路由（用户选定，非降级链）</text><text x="36" y="70" font-size="13" fill="#6b7280">设置里选「豆包」或「StepFun」；选定失败统一落 Piper → 系统兜底</text>
<rect x="60" y="150" width="200" height="90" rx="12" fill="#7C3AED"/><text x="160" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">VendorRouter</text><text x="160" y="212" text-anchor="middle" font-size="12" fill="#E9D5FF">cloudVendor = DOUBAO | STEPFUN</text>
<rect x="380" y="90" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="505" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">豆包（火山）</text><text x="505" y="150" text-anchor="middle" font-size="12" fill="#6b7280">TTS 豆包语音 · 视觉 doubao-vision</text><text x="505" y="172" text-anchor="middle" font-size="12" fill="#6b7280">凭据：方舟 Key + 语音 AppID/Token</text>
<rect x="700" y="90" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/><text x="815" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">StepFun（阶跃）</text><text x="815" y="150" text-anchor="middle" font-size="12" fill="#6b7280">step-tts-2.5 · step-flash-3.7</text><text x="815" y="172" text-anchor="middle" font-size="12" fill="#6b7280">凭据：一个 API Key</text>
<rect x="380" y="250" width="550" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="655" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">TTS 播报 / 云 OCR 增强 / AI 转译</text><text x="655" y="304" text-anchor="middle" font-size="12" fill="#6b7280">三个接口不变：TtsEngine · OcrEngine · TranslateService</text>
<rect x="380" y="350" width="550" height="60" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="6 4"/><text x="655" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">选定服务商失败 → Piper（离线兜底）→ 系统 TTS</text><text x="655" y="398" text-anchor="middle" font-size="12" fill="#B91C1C">Piper 从链中间位退为兜底</text>
