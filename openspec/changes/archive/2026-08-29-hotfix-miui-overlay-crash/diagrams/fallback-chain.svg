<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="PingFang SC, sans-serif"><rect width="960" height="360" fill="#F6F5FA"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker></defs><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">MIUI 悬浮窗授权深链（hotfix）</text><text x="36" y="70" font-size="13" fill="#6b7280">闪退根因：显式 Intent 指向 HyperOS 已弃用的组件 → ActivityNotFoundException 未捕获</text><rect x="60" y="120" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="160" y="150" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">「去授权」点击</text><text x="160" y="172" text-anchor="middle" font-size="12" fill="#6b7280">overlayPermissionIntent</text><rect x="330" y="120" width="240" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="450" y="150" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">resolveActivity 校验</text><text x="450" y="172" text-anchor="middle" font-size="12" fill="#6b7280">OEM 组件真实存在？</text><rect x="640" y="70" width="280" height="70" rx="12" fill="#F0FDF4" stroke="#16A34A"/><text x="780" y="100" text-anchor="middle" font-weight="700" font-size="14" fill="#166534">MIUI 权限编辑页（组件存在时）</text><text x="780" y="122" text-anchor="middle" font-size="12" fill="#166534">直达 · 带包名</text><rect x="640" y="170" width="280" height="70" rx="12" fill="#F0FDF4" stroke="#16A34A"/><text x="780" y="200" text-anchor="middle" font-weight="700" font-size="14" fill="#166534">应用详情页（兜底）</text><text x="780" y="222" text-anchor="middle" font-size="12" fill="#166534">全 ROM 必达 · 悬浮窗开关在内</text><rect x="640" y="270" width="280" height="64" rx="12" 