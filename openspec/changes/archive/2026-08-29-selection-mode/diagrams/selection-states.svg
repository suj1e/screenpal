ze="14" fill="#DC2626">拒选 &lt;48dp/单点</text><text x="390" y="278" text-anchor="middle" font-size="12" fill="#B91C1C">震动 · 无遮罩回 IDLE</text><path d="M 670 184 C 600 240 540 250 496 258" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/><rect x="40" y="230" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="130" y="254" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">重新框选</text><text x="130" y="278" text-anchor="middle" font-size="12" fill="#6b7280">回 IDLE</text><path d="M 860 190 C 700 330 320 330 140 298" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/><rect x="40" y="330" width="420" height="90" rx="12" fill="#DDD6FE" stroke="#DDD6FE" stroke-width="2"/><text x="250" y="367" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">模式 LASSO：随手画 · 8dp 采样 · 挖孔圈外暗</text><text x="250" y="391" text-anchor="middle" font-size="12" fill="#6b7280">#FFFFFF</text><rect x="500" y="330" width="420" height="90" rx="12" fill="#DDD6FE" stroke="#DDD6FE" stroke-width="2"/><text x="710" y="367" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">模式 RECT：拖拽矩形 · min/max 归一化 · 圈外暗</text><text x="710" y="391" text-anchor="middle" font-size="12" fill="#6b7280">#FFFFFF</text><text x="60" y="452" font-size="12" fill="#6b7280">两模式共享：48dp 门槛 · 确认回调 · 震动拒选 · 圈外遮罩；设置键 selectionMode 默认 LASSO</text></svg>