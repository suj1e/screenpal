    <text x="551" y="154" text-anchor="middle" fill="#6b7280">SupervisorJob + IO · 不阻塞</text>

    <rect x="696" y="110" width="188" height="56" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="790" y="134" text-anchor="middle" font-weight="700" fill="#1a1a2e">ttsManager.initialize()</text>
    <text x="790" y="154" text-anchor="middle" fill="#6b7280">runCatching · 失败仅记日志</text>

    <rect x="330" y="240" width="220" height="66" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="440" y="266" text-anchor="middle" font-weight="700" fill="#1a1a2e">PiperTtsEngine.initialize</text>
    <text x="440" y="288" text-anchor="middle" fill="#6b7280">hasModel() ？</text>

    <rect x="80" y="360" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="180" y="386" text-anchor="middle" font-weight="700" fill="#1a1a2e">下载模型（~15MB）</text>
    <text x="180" y="408" text-anchor="middle" fill="#6b7280">断点续传 · HuggingFace</text>

    <rect x="380" y="360" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
