    <rect x="650" y="360" width="230" height="66" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="6 4"/>
    <text x="765" y="386" text-anchor="middle" font-weight="700" fill="#DC2626">下载失败 → 记日志不崩溃</text>
    <text x="765" y="408" text-anchor="middle" fill="#B91C1C">下次启动 hasModel 为假自动重试</text>
