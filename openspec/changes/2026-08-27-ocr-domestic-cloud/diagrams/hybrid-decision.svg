<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, 'PingFang SC', sans-serif"><rect width="960" height="400" fill="#F6F5FA"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker></defs><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">OCR 混合决策</text><text x="36" y="70" font-size="13" fill="#6b7280">端侧 PaddleOCR 为主，低置信度时百度云增强；无 Key/失败静默降级端侧</text><rect x="60" y="160" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="150" y="187" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">框选截图</text><text x="150" y="211" text-anchor="middle" font-size="12" fill="#6b7280">裁剪区域</text><rect x="300" y="160" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="390" y="187" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">PaddleOCR</text><text x="390" y="211" text-anchor="middle" font-size="12" fill="#6b7280">端侧 · 置信度</text><path d="M 480 195 L 540 195" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><polygon points="540,160 620,160 580,230 500,230" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="560" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">conf ≥ 0.75</text><text x="560" y="210" text-anchor="middle" font-size="12" fill="#6b7280">或有 Key？</text><rect x="680" y="110" width="220" height="70" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="790" y="137" text-anchor="middle" font-weight="700" font-size="14" fill="#166534">端侧结果</text><text x="790" y="161" text-anchor="middle" font-size="12" fill="#166534">conf&lt;0.75 → 云</text><rect x="680" y="230" width="220" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="790" y="257" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">百度云 OCR</text><text x="790" y="281" text-anchor="middle" font-size="12" fill="#6b7280">accurate_basic · conf=0.99</text><path d="M 580 165 L 674 150" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 580 225 L 674 260" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="620" y="140" font-size="12" fill="#16A34A">够好/无Key</text><text x="600" y="262" font-size="12" fill="#7C3AED">不行→问云</text></svg>