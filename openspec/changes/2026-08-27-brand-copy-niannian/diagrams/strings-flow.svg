<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F6F5FA"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1a1a2e">「念念」品牌文案资源流向（2026-08-27-brand-copy-niannian）</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">strings.xml 单源 → 资源引用消费；开发面常量（渠道 ID / TAG / 包名）保持原样</text>

  <!-- source: strings.xml -->
  <rect x="40" y="120" width="240" height="330" rx="14" fill="#7C3AED"/>
  <text x="160" y="156" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">strings.xml（单源）</text>
  <g font-size="13" fill="#F3E8FF">
    <rect x="60" y="176" width="200" height="52" rx="8" fill="#5B21B6"/>
    <text x="72" y="198" fill="#FFFFFF">app_title</text>
    <text x="72" y="217" fill="#D8B4FE">念念 · 屏幕识别 + 语音播报</text>
    <rect x="60" y="240" width="200" height="52" rx="8" fill="#5B21B6"/>
    <text x="72" y="262" fill="#FFFFFF">notification_floating_title</text>
    <text x="72" y="281" fill="#D8B4FE">念念悬浮窗运行中</text>
    <rect x="60" y="304" width="200" height="52" rx="8" fill="#5B21B6"/>
    <text x="72" y="326" fill="#FFFFFF">channel_floating_name</text>
    <text x="72" y="345" fill="#D8B4FE">念念悬浮窗</text>
    <rect x="60" y="368" width="200" height="52" rx="8" fill="#5B21B6"/>
    <text x="72" y="390" fill="#FFFFFF">channel_capture_name</text>
    <text x="72" y="409" fill="#D8B4FE">念念截图</text>
  </g>

  <!-- consumers -->
  <g font-size="13">
    <rect x="480" y="110" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="500" y="140" font-weight="700" fill="#1a1a2e">MainActivity（Compose）</text>
    <text x="500" y="164" fill="#6b7280">stringResource(app_title)</text>

    <rect x="480" y="206" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="500" y="236" font-weight="700" fill="#1a1a2e">FloatingWindowService</text>
    <text x="500" y="260" fill="#6b7280">通知标题 + 渠道名（getString）</text>

    <rect x="480" y="302" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="500" y="332" font-weight="700" fill="#1a1a2e">ScreenCaptureService</text>
    <text x="500" y="356" fill="#6b7280">渠道名（getString）</text>

    <rect x="480" y="398" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="500" y="428" font-weight="700" fill="#1a1a2e">SelectionOverlayActivity</text>
    <text x="500" y="452" fill="#6b7280">剪贴板 label（字面量「念念」）</text>
  </g>

  <!-- arrows -->
  <g stroke="#7C3AED" stroke-width="2" fill="none">
    <path d="M 280 202 C 380 202 380 148 474 148" marker-end="url(#arrow)"/>
    <path d="M 280 266 C 380 266 380 244 474 244" marker-end="url(#arrow)"/>
    <path d="M 280 330 C 380 330 380 340 474 340" marker-end="url(#arrow)"/>
    <path d="M 280 420 C 380 420 380 436 474 436" stroke-dasharray="6 4"/>
    <polygon points="474,436 464,431 464,441" fill="#7C3AED"/>
  </g>

  <!-- untouched boundary -->
  <rect x="480" y="492" width="440" height="52" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="7 5"/>
  <text x="500" y="514" font-size="13" font-weight="700" fill="#4B5563">禁改边界（开发面）</text>
  <text x="500" y="534" font-size="12" fill="#6b7280">CHANNEL_ID · Log TAG · UTTERANCE_ID · 包名 · Theme.ScreenPal · prototypes</text>
  <path d="M 700 492 L 700 460" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="708" y="480" font-size="11" fill="#9CA3AF">不消费品牌资源</text>

  <!-- side labels -->
  <text x="380" y="96" font-size="12" fill="#7C3AED">资源引用 ←</text>
  <text x="560" y="96" font-size="12" fill="#9CA3AF">系统设置「应用通知」页将随 createNotificationChannel 刷新渠道名</text>
</svg>
