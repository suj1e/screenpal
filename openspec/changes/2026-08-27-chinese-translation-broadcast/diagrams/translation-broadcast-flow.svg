<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="-apple-system, 'PingFang SC', sans-serif"><rect width="960" height="460" fill="#F6F5FA"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker></defs><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">中文播报管道（豆包翻译）</text><text x="36" y="70" font-size="13" fill="#6b7280">OCR 文本 → 语言启发 →（非中文）豆包翻译（方舟）→ TTS；失败逐级降级不阻塞</text><rect x="60" y="150" width="180" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="150" y="180" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">OCR 文本</text><text x="150" y="204" text-anchor="middle" font-size="12" fill="#6b7280">框选识别结果</text><rect x="280" y="150" width="180" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="370" y="180" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">语言启发</text><text x="370" y="204" text-anchor="middle" font-size="12" fill="#6b7280">CJK 占比≥0.5？</text><rect x="500" y="150" width="180" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="590" y="180" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">豆包翻译</text><text x="590" y="204" text-anchor="middle" font-size="12" fill="#6b7280">方舟 · 温度0</text><rect x="720" y="150" width="180" height="76" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="810" y="180" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">TTS 播报</text><text x="810" y="204" text-anchor="middle" font-size="12" fill="#6b7280">豆包/Piper/系统</text><path d="M 240 188 L 274 188" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 460 188 L 494 188" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 680 188 L 714 188" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 370 226 C 370 300 700 260 780 220" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/><text x="430" y="292" font-size="12" fill="#16A34A">中文 → 直读（零网络）</text><rect x="280" y="330" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="370" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">译文主显</text><text x="370" y="376" text-anchor="middle" font-size="12" fill="#6b7280">原文小字可溯</text><rect x="500" y="330" width="180" height="60" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="590" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#DC2626">翻译失败 5s 超时</text><text x="590" y="376" text-anchor="middle" font-size="12" fill="#B91C1C">降级播原文+「翻译不可用」</text><rect x="720" y="330" width="180" height="60" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="810" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#4B5563">开关关闭</text><text x="810" y="376" text-anchor="middle" font-size="12" fill="#6b7280">行为退回直读原文</text><path d="M 590 226 L 590 324" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 620 226 C 640 280 640 300 620 324" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/></svg>