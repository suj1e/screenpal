<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="PingFang SC, sans-serif"><rect width="960" height="440" fill="#F6F5FA"/><text x="36" y="46" font-size="22" font-weight="700" fill="#1a1a2e">截屏路由：无障碍优先，MediaProjection 兜底</text><text x="36" y="70" font-size="13" fill="#6b7280">Android 11+ 已开启无障碍 → 静默截屏零弹窗；否则引导或回落</text><rect x="60" y="150" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="150" y="177" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">点悬浮球</text><text x="150" y="201" text-anchor="middle" font-size="12" fill="#6b7280">onBallClicked</text><polygon points="430,140 530,140 490,220 390,220" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="460" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">API≥30 且</text><text x="460" y="196" text-anchor="middle" font-size="12" fill="#6b7280">无障碍已开启？</text><rect x="620" y="90" width="290" height="70" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="765" y="117" text-anchor="middle" font-weight="700" font-size="14" fill="#166534">无障碍静默截屏</text><text x="765" y="141" text-anchor="middle" font-size="12" fill="#166534">takeScreenshot → 零弹窗</text><rect x="620" y="180" width="290" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="765" y="207" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">引导对话框</text><text x="765" y="231" text-anchor="middle" font-size="12" fill="#6b7280">去开启无障碍 / 本次仍用录屏</text><rect x="620" y="270" width="290" height="70" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/><text x="765" y="297" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a2e">MediaProjection 兜底</text><text x="765" y="321" text-anchor="middle" font-size="12" fill="#6b7280">现状路径（API&lt;30 必经）</text><path d="M 240 185 L 384 185" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 490 145 L 614 130" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 490 215 L 614 215" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 490 220 C 540 260 560 280 614 300" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/><text x="500" y="125" font-size="12" fill="#16A34A">是</text><text x="500" y="230" font-size="12" fill="#7C3AED">否(可引导)</text><text x="520" y="272" font-size="12" fill="#DC2626">API&lt;30</text><text x="60" y="380" font-size="12" fill="#6b7280">限流：连续截屏 ≥333ms 间隔（约 3 次/秒），手动点球不受影响；触发时提示稍候重试</text></svg>